<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/assets/img/favicon.png" />

    <!-- Primary SEO -->
    <title>phillipLabs | Websites & Business Systems in Kenya</title>
        <meta name="author" content="Phillip Kinuthia" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="KE-47" />
    <meta name="geo.placename" content="Nairobi, Kenya" />
    <meta name="geo.position" content="-1.286389;36.817223" />
    <meta name="ICBM" content="-1.286389, 36.817223" />

    <!-- Open Graph (page-agnostic defaults only — title/description/url/type are set per-route via Helmet) -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:site_name" content="phillipLabs" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="phillipLabs | Websites & Business Systems in Kenya" />
    <meta name="twitter:description" content="Custom websites and business systems for Kenyan businesses. Fixed prices, M-Pesa and WhatsApp ready." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Phillip Kinuthia",
      "jobTitle": "Founder & Lead Developer",
      "description": "Founder of phillipLabs, a Nairobi studio building custom websites, dashboards and business systems for Kenyan businesses.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nairobi",
        "addressRegion": "Nairobi County",
        "addressCountry": "KE"
      },
      "email": "%VITE_CONTACT_EMAIL%",
      "telephone": "%VITE_CONTACT_PHONE%",
      "url": "%VITE_SITE_URL%/",
      "image": "%VITE_SITE_URL%/og-image.png",
      "sameAs": [
        "https://github.com/littlephillips",
        "https://www.linkedin.com/in/phillip-kinuthia-10a2101a0/",
        "https://www.facebook.com/phillip.phillips.1800/",
        "https://www.instagram.com/little_phillips/",
        "https://medium.com/@phillipkinuthia72"
      ]
    }
    </script>

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "phillipLabs",
      "description": "Custom websites, dashboards, CRM and business systems for Kenyan businesses.",
      "founder": { "@type": "Person", "name": "Phillip Kinuthia" },
      "url": "%VITE_SITE_URL%/",
      "telephone": "%VITE_CONTACT_PHONE%",
      "email": "%VITE_CONTACT_EMAIL%",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nairobi",
        "addressCountry": "KE"
      },
      "areaServed": "Kenya",
      "priceRange": "Ksh 8,000+",
      "currenciesAccepted": "KES",
      "paymentAccepted": "M-Pesa, Bank Transfer",
      "openingHours": "Mo-Fr 08:00-18:00",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "phillipLabs services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business websites" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Dashboards & CRM" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Online stores & M-Pesa" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO & speed" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom business systems" } }
        ]
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <noscript>phillipLabs builds custom websites and business systems for Kenyan businesses. Enable JavaScript to view this site, or chat with us on WhatsApp.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
