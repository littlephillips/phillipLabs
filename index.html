<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/assets/img/favicon.png" />

    <!-- Primary SEO -->
    <title>phillipLabs | Websites & Business Systems That Actually Sell — Kenya</title>
    <meta name="keywords" content="freelance web developer Nairobi, custom website Kenya, CRM system Nairobi, web developer Kenya, small business website Kenya, M-Pesa integration, e-commerce Kenya, React developer Nairobi, web design Thika, business dashboard Kenya, WhatsApp business website" />
    <meta name="author" content="Phillip Kinuthia" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="KE-47" />
    <meta name="geo.placename" content="Nairobi, Kenya" />
    <meta name="geo.position" content="-1.286389;36.817223" />
    <meta name="ICBM" content="-1.286389, 36.817223" />

    <!-- Open Graph (page-agnostic defaults only — title/description/url/type are set per-route via Helmet) -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:site_name" content="phillipLabs" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="phillipLabs | Websites & Business Systems — Kenya" />
    <meta name="twitter:description" content="Websites and business systems for Kenyan SMBs. No templates. M-Pesa, WhatsApp, CRM." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Phillip Kinuthia",
      "jobTitle": "Freelance Web Developer",
      "description": "Nairobi-based freelance web developer specialising in custom websites, CRM systems, dashboards and e-commerce for Kenyan small businesses.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Thika",
        "addressRegion": "Nairobi",
        "addressCountry": "KE"
      },
      "email": "%VITE_CONTACT_EMAIL%",
      "telephone": "+254797321068",
      "url": "%VITE_SITE_URL%/",
      "image": "%VITE_SITE_URL%/og-image.png",
      "sameAs": [
        "https://github.com/littlephillips",
        "https://www.linkedin.com/in/phillip-kinuthia-10a2101a0/",
        "https://www.facebook.com/phillip.phillips.1800/",
        "https://www.instagram.com/little_phillips/",
        "https://medium.com/@phillipkinuthia72"
      ]
    }
    </script>

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "phillipLabs",
      "description": "Custom website development, CRM systems, dashboards and digital business tools for Kenyan small businesses.",
      "url": "%VITE_SITE_URL%/",
      "telephone": "+254797321068",
      "email": "%VITE_CONTACT_EMAIL%",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nairobi",
        "addressCountry": "KE"
      },
      "areaServed": "Kenya",
      "priceRange": "Ksh 7,000 – 100,000",
      "currenciesAccepted": "KES",
      "paymentAccepted": "M-Pesa, Bank Transfer",
      "openingHours": "Mo-Fr 08:00-18:00",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Web Development Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Website Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "CRM & Business Dashboard" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "E-commerce & M-Pesa Integration" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO & Performance Optimisation" } }
        ]
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
